<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow"> <!--後で消す！！-->

    <title>茨城大学 航空技術研究会</title>
    <meta name="description" content="茨城大学航空技術研究会の公式サイトです。飛行機やドローンの設計・製作、飛行活動、地域イベントへの参加などを紹介しています。">
    <meta property="og:title" content="茨城大学 航空技術研究会">
    <meta property="og:description" content="ものづくりを、空へ。茨城大学航空技術研究会の活動やイベントを紹介します。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="images/top1-pc.webp">
    <meta property="og:site_name" content="茨城大学 航空技術研究会">
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="header"></div>
    <!-- メインビジュアル -->
    <main>
        <section class="main-visual">

            <div class="slideshow">

                <!-- キャッチコピー -->
                <div class="hero-copy">

                    <p class="hero-subtitle">
                        航空技術研究会
                    </p>

                    <h1 class="hero-title">
                        ものづくりを、<br>
                        空へ。
                    </h1>

                </div>

                <!-- 1枚目 -->
                <picture class="slide active">

                    <source media="(max-width:1164px)"
                            srcset="images/top1-sp.webp">

                    <img src="images/top1-pc.webp"
                        alt="トップ画像1"
                        fetchpriority="high"
                        decoding="async">

                </picture>

                <!-- 2枚目 -->
                <picture class="slide">

                    <source media="(max-width:1164px)"
                            srcset="images/top2-sp.webp">

                    <img src="images/top2-pc.webp"
                        alt="トップ画像2"
                        loading="lazy"
                        decoding="async">

                </picture>

                <!-- 3枚目 -->
                <picture class="slide">

                    <source media="(max-width:1164px)"
                            srcset="images/top3-sp.webp">

                    <img src="images/top3-pc.webp"
                        alt="トップ画像3"
                        loading="lazy"
                        decoding="async">

                </picture>

            </div>

            <!-- 左右ボタン -->
            <button class="prev">&#10094;</button>
            <button class="next">&#10095;</button>

            <!-- 一時停止 -->
            <button class="pause-button">❚❚</button>

            <!-- ドット -->
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>

        </section>

        <!-- イベント情報・お知らせ -->
        <section class="news">
            <h2>イベント情報・お知らせ</h2>
            <!-- カテゴリータブ -->
            <div class="news-tabs">
                <button class="news-tab active" data-category="all">すべて</button>
                <button class="news-tab" data-category="event">イベント</button>
                <button class="news-tab" data-category="blog">ブログ</button>
            </div>
            <!-- お知らせ一覧 -->
            <div class="news-list" id="news-list">

                <!--更新時ここを変更■■■---------------------------------------------------->

                <article class="news-item" data-category="event">
                    <time datetime="2026-11-17">2026.10.03</time>
                    <span class="news-category">イベント</span>
                    <a href="trial.html">11/14(土)-11/15(日)に茨苑祭が開催されます！(水戸キャンパス)</a>
                </article>

                <article class="news-item" data-category="event">
                    <time datetime="2026-11-14">2026.10.02</time>
                    <span class="news-category">イベント</span>
                    <a href="trial.html">11/07(土)にこうがく祭が開催されます！(日立キャンパス)</a>
                </article>

            </div>
        </section>
        <!----------------------------------------------------------------------------------->
        <!-- ====================
             活動スケジュール
             ==================== -->

        <section id="schedule" class="schedule-section">

            <div class="section-heading">
                <p class="section-subtitle">
                    SCHEDULE
                </p>

                <div class="schedule-title-row">
                    <h2 class="section-title">
                        活動予定表
                    </h2>
                    <a href="meeting.html"
                       class="schedule-meeting-button"
                       aria-label="ミーティング詳細">
                        M
                    </a>
                </div>
            </div>
                <div class="schedule-list" id="schedule-list">
                </div>
</section>

    </main>
    <div id="footer"></div>
    <script src="common.js"></script>
    <script src="schedule.js"></script>
    <script src="home.js"></script>
</body>
</html>
